name: Build CV PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed by the release step; read would do otherwise
    env:
      # Pinned so CI renders byte-for-byte what you get locally. Bump both
      # deliberately; pandoc's typst writer and typst itself both move fast.
      PANDOC_VERSION: "3.10"
      TYPST_VERSION: "v0.15.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          curl -fsSLo /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: Install typst
        run: |
          curl -fsSL \
            "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ -C /tmp
          sudo install /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Build PDF
        id: build
        run: bash render/build-cv.sh

      - name: Check readme.md was left pristine
        run: git diff --exit-code -- readme.md

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.pdf-name }}
          path: ${{ steps.build.outputs.pdf-path }}
          if-no-files-found: error

      # Only on `git push origin vX`: attach the same PDF to a permanent
      # release. `gh` is preinstalled on the runner, so this needs no action.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          PDF: ${{ steps.build.outputs.pdf-path }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$PDF" \
            --title "CV $GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" "$PDF" --clobber   # re-run of an existing tag

      # Only on pushes to main: a single release tagged `latest`, rebuilt in
      # place, so there is one URL that always serves the current CV. The tag
      # has to be deleted and recreated rather than edited -- GitHub ignores
      # --target for a tag that already exists, so the release would otherwise
      # stay pinned to whichever commit first created it.
      - name: Update rolling `latest` release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          PDF: ${{ steps.build.outputs.pdf-path }}
        run: |
          # Same PDF under a date-free, space-free name, so the link below
          # never changes and needs no %20 escaping.
          STABLE=$(basename "$PDF" .pdf)   # Name Surname CV 2026-08-19
          STABLE=${STABLE% *}              # drop the trailing date
          STABLE=${STABLE// /-}.pdf        # Name-Surname-CV.pdf
          cp "$PDF" "$STABLE"

          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$STABLE" \
            --target "$GITHUB_SHA" \
            --title "Latest CV" \
            --prerelease \
            --notes "Rebuilt automatically from ${GITHUB_SHA:0:7}. Always the current CV; see the tagged releases for fixed versions."
